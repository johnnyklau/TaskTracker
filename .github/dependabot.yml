version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=25']
    groups:
      tanstack:
        patterns: ['@tanstack/*']

  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']
      - dependency-name: '@types/node'
        versions: ['>=25']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
